<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="55%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1E1B4B" />
    </linearGradient>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4CD7F6" />
      <stop offset="50%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
    <radialGradient id="glowCenter" cx="50%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <circle cx="256" cy="256" r="210" fill="url(#glowCenter)" />
  <rect x="28" y="28" width="456" height="456" rx="92" fill="none" stroke="url(#neonGrad)" stroke-opacity="0.35" stroke-width="4" />

  <!-- Outer Neural Hexagon -->
  <polygon
    points="256,88 401,172 401,340 256,424 111,340 111,172"
    fill="none"
    stroke="url(#neonGrad)"
    stroke-width="14"
    stroke-linejoin="round"
  />

  <!-- Inner Synaptic Connections -->
  <g stroke="#4CD7F6" stroke-width="8" stroke-linecap="round" stroke-opacity="0.7">
    <line x1="256" y1="88" x2="256" y2="256" />
    <line x1="401" y1="172" x2="256" y2="256" />
    <line x1="401" y1="340" x2="256" y2="256" />
    <line x1="256" y1="424" x2="256" y2="256" />
    <line x1="111" y1="340" x2="256" y2="256" />
    <line x1="111" y1="172" x2="256" y2="256" />
  </g>

  <!-- Outer Nodes -->
  <circle cx="256" cy="88" r="20" fill="#4CD7F6" stroke="#0B0F19" stroke-width="6" />
  <circle cx="401" cy="172" r="18" fill="#06B6D4" stroke="#0B0F19" stroke-width="6" />
  <circle cx="401" cy="340" r="18" fill="#8B5CF6" stroke="#0B0F19" stroke-width="6" />
  <circle cx="256" cy="424" r="20" fill="#A855F7" stroke="#0B0F19" stroke-width="6" />
  <circle cx="111" cy="340" r="18" fill="#10B981" stroke="#0B0F19" stroke-width="6" />
  <circle cx="111" cy="172" r="18" fill="#4CD7F6" stroke="#0B0F19" stroke-width="6" />

  <!-- Core AI Spark -->
  <circle cx="256" cy="256" r="46" fill="#0B0F19" stroke="url(#neonGrad)" stroke-width="10" />
  <circle cx="256" cy="256" r="22" fill="#4CD7F6" />
</svg>
