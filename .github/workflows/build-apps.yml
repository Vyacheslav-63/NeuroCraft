name: Build Installable Apps (Windows, macOS, Android APK)

on:
  workflow_dispatch:

jobs:
  build-desktop:
    name: Build Desktop (${{ matrix.os }})
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build web assets
        run: npm run build
      - name: Install Electron builder
        run: npm install --no-save electron electron-builder
      - name: Package installer
        run: npx electron-builder --publish never
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: neurocraft-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip

  build-android-apk:
    name: Build Android Debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install dependencies
        run: npm install
      - name: Build web assets
        run: npm run build
      - name: Initialize Capacitor Android project
        run: |
          npm install --no-save @capacitor/core @capacitor/cli @capacitor/android
          npx cap add android
          npx cap sync android
      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: neurocraft-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
